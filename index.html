<!doctype html>
<html lang="en" data-motion="on">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#17121c" />
    <title>Relationship Wrapped</title>
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />

    <link rel="preload" href="/fonts/display-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/text-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/logo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/wrapped.json" as="fetch" type="application/json" crossorigin />

    <!-- The loader has to be right before any stylesheet has parsed. -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #17121c;
      }
      #loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #17121c;
      }
      /* Shown only if the page's script never starts — a file preview that
         renders HTML without running it, say — so the loader says why it is
         still there instead of breathing forever. Pure CSS on purpose: it has
         to work in exactly the case where nothing else does. */
      .loader__stuck {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 28%;
        margin: 0;
        padding: 0 2rem;
        color: #c9bbd1;
        font: 500 1rem/1.4 system-ui, -apple-system, sans-serif;
        text-align: center;
        opacity: 0;
        animation: loader-stuck 400ms ease-out 5s forwards;
      }
      html[data-js] .loader__stuck {
        display: none;
      }
      @keyframes loader-stuck {
        to {
          opacity: 1;
        }
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main
      id="stage"
      class="stage"
      tabindex="0"
      aria-roledescription="card sequence"
      aria-describedby="how"
    ></main>

    <div class="grain" aria-hidden="true"></div>

    <p id="how" class="a11y">Use the right and left arrow keys to move through the cards.</p>
    <p id="live" class="a11y" role="status" aria-live="polite"></p>

    <div id="pace" class="pace" aria-hidden="true"></div>

    <p id="begin" class="begin">Tap to begin</p>

    <button id="prev" class="control control--prev" type="button">Back</button>
    <button id="next" class="control control--next" type="button">Next</button>

    <div class="chrome">
      <!-- Always there. A still page and a broken page look the same, and this
           is the only thing that tells them apart from inside the page. -->
      <button id="motion" class="chip motion" type="button" aria-pressed="true">
        <span class="a11y">Motion</span>
        <!-- Something moving, with the trail behind it; struck through when it
             is not. -->
        <svg class="motion__on" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="14.5" cy="12" r="5" />
          <path d="M7 8.5h2.5" />
          <path d="M3.5 12h4.5" />
          <path d="M7 15.5h2.5" />
        </svg>
        <svg class="motion__off" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="14.5" cy="12" r="5" />
          <path d="M7 8.5h2.5" />
          <path d="M3.5 12h4.5" />
          <path d="M7 15.5h2.5" />
          <path d="M4 20L20 4" />
        </svg>
      </button>

      <button id="sound" class="chip sound" type="button" aria-pressed="false">
        <span class="a11y">Sound</span>
        <svg class="sound__on" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z" />
          <path d="M16.5 8.5a5 5 0 0 1 0 7" />
          <path d="M19 6a8.5 8.5 0 0 1 0 12" />
        </svg>
        <svg class="sound__off" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z" />
          <path d="M17 10l4 4" />
          <path d="M21 10l-4 4" />
        </svg>
      </button>
    </div>

    <div id="loader" class="loader">
      <span class="loader__mark"></span>
      <p class="loader__stuck">
        This needs to open in a web browser. If it came from a file or a message, open it in
        Safari or Chrome instead.
      </p>
    </div>

  </body>
</html>
